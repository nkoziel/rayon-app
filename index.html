        <button class="btn ghost filterbtn" id="filterBtn" aria-expanded="false">Filtres<span class="dot hidden" id="filterDot"></span></button>
        <button class="btn ghost" id="moreBtn2" aria-expanded="false">•••</button>
      </div>
      <div class="filtersum" id="filterSum"></div>
      <div class="panel hidden" id="filterPanel">
        <div class="chiprow" id="typeLibRow" role="group" aria-label="Type"></div>
        <div class="chiprow" id="shelfRow" role="group" aria-label="Rayon"></div>
        <div class="chiprow" id="srcRow" role="group" aria-label="Source"></div>
        <div class="chiprow" id="sortRow" role="group" aria-label="Tri"></div>
      </div>
      <div class="morebar hidden" id="moreBar">
        <button class="btn ghost" id="viewBtn">Vue liste</button>
        <button class="btn ghost" id="unitBtn">Suivi : chapitres</button>
        <button class="btn ghost" id="mdBatch">Vérifier les sorties</button>
        <button class="btn ghost" id="importBtn">Importer</button>
        <button class="btn ghost" id="exportBtn">Exporter</button>
        <button class="btn ghost danger" id="resetBtn">Tout effacer</button>
        <input type="file" id="file" accept=".tachibk,.json,.gz" class="hidden">
      </div>
      <div class="statusline" id="statusline"></div>
    </div>
    <div id="results"></div>
  </section>

  <!-- ===== onglet découvrir ===== -->
  <section id="viewDiscover" class="hidden">
    <div class="toolbar">
      <div class="row">
        <button class="btn" id="runDiscover">Analyser</button>
        <button class="btn ghost" id="dFilterBtn" aria-expanded="false">Filtres</button>
        <button class="btn ghost" id="resetDismissed">Réafficher les écartés</button>
      </div>
      <div class="panel hidden" id="dFilterPanel">
        <div class="chiprow" id="seedRow" role="group" aria-label="Séries analysées"></div>
        <div class="chiprow" id="typeRow" role="group" aria-label="Type"></div>
        <div class="chiprow" id="dsortRow" role="group" aria-label="Tri"></div>
      </div>
      <div class="progress hidden" id="discoverProgress"><i style="width:0%"></i></div>
      <div class="statusline" id="discoverStatus"></div>
    </div>
    <div id="discoverBox"></div>
  </section>

  <p class="foot">
    Recommandations : API AniList, votées par les lecteurs.<br>
    Tout est stocké dans ce navigateur. Aucune donnée n'est envoyée ailleurs.
  </p>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabLibrary" aria-selected="true"><span class="badge" id="tabLibN">0</span>Bibliothèque</button>
  <button class="tab" role="tab" id="tabDiscover" aria-selected="false"><span class="badge" id="tabDiscN">—</span>Découvrir</button>
  <button class="tab" role="tab" id="tabAdd" aria-selected="false"><span class="badge">＋</span>Ajouter</button>
</nav>

<div id="overlay"></div>
<div id="modalHost"></div>
<div class="dropzone hidden" id="dropzone">Dépose ta sauvegarde .tachibk ou ton export .json</div>

</body>
</html>
